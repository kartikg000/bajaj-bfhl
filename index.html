<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BFHL Node Explorer — Opus I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #EAE7E0;
      /* Classic parchment/alabaster */
      --surface: #F5F4F0;
      --ink: #0D0D0D;
      /* Stark charcoal/black */
      --red: #D32F2F;
      /* The Nothing signature red dot */
      --muted: #666666;

      --font-serif: 'Playfair Display', serif;
      --font-mono: 'Space Mono', monospace;

      --border-thin: 1px solid var(--ink);
      --border-thick: 3px solid var(--ink);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      /* Nothing.tech style dot matrix background */
      background-image: radial-gradient(rgba(13, 13, 13, 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--surface);
      border: var(--border-thick);
      position: relative;
      box-shadow: 15px 15px 0px var(--ink);
      /* Brutalist shadow */
    }

    /* The Signature Red Dot */
    .container::before {
      content: '';
      position: absolute;
      top: -6px;
      right: -6px;
      width: 12px;
      height: 12px;
      background-color: var(--red);
      border-radius: 50%;
      z-index: 10;
    }

    header {
      padding: 40px;
      border-bottom: var(--border-thick);
      position: relative;
      background: var(--bg);
    }

    .tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink);
      border: var(--border-thin);
      padding: 6px 12px;
      margin-bottom: 24px;
      background: transparent;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(40px, 8vw, 70px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    h1 span {
      font-weight: 400;
      font-style: italic;
      color: var(--red);
    }

    .subtitle {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      max-width: 600px;
    }

    .input-section {
      padding: 40px;
      border-bottom: var(--border-thick);
    }

    .section-label {
      font-family: var(--font-serif);
      font-size: 24px;
      font-style: italic;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .section-label::before {
      content: '§ ';
      color: var(--red);
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 16px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: transparent;
      border: var(--border-thin);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 16px;
      outline: none;
      transition: all 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 160px;
      line-height: 1.6;
    }

    input[type="text"]:focus,
    textarea:focus {
      box-shadow: 4px 4px 0px var(--ink);
      background: #fff;
    }

    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-row {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    button {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: var(--border-thin);
      padding: 16px 32px;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--ink);
    }

    .btn-primary {
      background: var(--ink);
      color: var(--surface);
    }

    .btn-primary:hover {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .btn-ghost:hover {
      box-shadow: 4px 4px 0px var(--ink);
      background: #fff;
    }

    /* API URL row */
    .api-row {
      margin-bottom: 32px;
    }

    /* Error */
    .error-box {
      background: transparent;
      border-bottom: var(--border-thick);
      padding: 24px 40px;
      color: var(--red);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Results */
    .results {
      background: var(--bg);
    }

    .results-header {
      padding: 32px 40px;
      border-bottom: var(--border-thin);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .results-title {
      font-family: var(--font-serif);
      font-size: 32px;
      font-style: italic;
    }

    .badge {
      font-size: 11px;
      padding: 4px 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: var(--border-thin);
      background: #fff;
    }

    .badge-red {
      border-color: var(--red);
      color: var(--red);
    }

    /* Summary Grid - Nothing Style Brutalist Table */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: var(--border-thick);
    }

    @media (max-width: 768px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .summary-card {
      padding: 24px;
      border-right: var(--border-thin);
      border-bottom: var(--border-thin);
      text-align: left;
    }

    .summary-grid .summary-card:last-child {
      border-right: none;
    }

    .summary-card .val {
      font-family: var(--font-serif);
      font-size: 48px;
      line-height: 1;
      color: var(--ink);
    }

    .summary-card .lbl {
      font-size: 10px;
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Identity row */
    .identity-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: var(--border-thick);
    }

    @media (max-width: 768px) {
      .identity-row {
        grid-template-columns: 1fr;
      }
    }

    .identity-chip {
      padding: 16px 24px;
      border-right: var(--border-thin);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .identity-row .identity-chip:last-child {
      border-right: none;
    }

    .identity-chip span {
      color: var(--ink);
      font-weight: 700;
      display: block;
      margin-top: 4px;
      font-size: 13px;
      text-transform: none;
    }

    /* Hierarchies */
    .content-section {
      padding: 40px;
      border-bottom: var(--border-thick);
    }

    .content-section:last-child {
      border-bottom: none;
    }

    .hierarchy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .h-card {
      background: transparent;
      border: var(--border-thin);
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .h-card.cyclic {
      border-color: var(--red);
    }

    .h-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: var(--border-thin);
      background: var(--surface);
    }

    .h-card.cyclic .h-header {
      border-bottom-color: var(--red);
      background: rgba(211, 47, 47, 0.05);
    }

    .root-label {
      font-family: var(--font-serif);
      font-size: 28px;
      font-style: italic;
      color: var(--ink);
    }

    .depth-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tree-visual {
      padding: 20px;
      font-size: 13px;
      line-height: 1.8;
      background: transparent;
      flex-grow: 1;
      overflow-x: auto;
    }

    .cycle-msg {
      padding: 20px;
      color: var(--red);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Invalid / Duplicates */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .pill {
      padding: 8px 16px;
      border: var(--border-thin);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: #fff;
    }

    .pill-red {
      color: var(--red);
      border-color: var(--red);
    }

    .empty-note {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 16px;
    }

    /* Loading */
    .loading {
      padding: 24px 40px;
      border-bottom: var(--border-thick);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      background: var(--red);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 0.2;
      }

      100% {
        opacity: 1;
      }
    }

    /* Tree renderer */
    .tree-line {
      display: block;
    }

    .tree-connector {
      color: var(--muted);
    }

    .tree-node {
      color: var(--ink);
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="tag">System.Init()</div>
      <h1>Structural <span>Analysis</span></h1>
      <p class="subtitle">A brutalist interpretation of hierarchical graph processing and cyclical detection mapping.
      </p>
    </header>

    <div class="input-section">
      <div class="section-label">I. Server Coordinates</div>
      <div class="api-row">
        <input type="text" id="apiUrl" placeholder="https://your-api.onrender.com" />
      </div>

      <div class="section-label">II. Data Matrix</div>
      <textarea id="nodeInput" placeholder='Comma or newline separated vectors, e.g.:
A->B, A->C, B->D, C->E, E->F, X->Y, Y->Z, Z->X'></textarea>
      <div class="hint">Format Strict: [Uppercase]->[Uppercase]</div>

      <div class="btn-row">
        <button class="btn-primary" id="submitBtn" onclick="handleSubmit()">Execute Compilation</button>
        <button class="btn-ghost" onclick="loadExample()">Inject Mock Data</button>
        <button class="btn-ghost" onclick="clearAll()">Purge</button>
      </div>
    </div>

    <div id="errorBox" style="display:none" class="error-box"></div>
    <div id="loadingBox" style="display:none" class="loading">
      <div class="spinner"></div> Awaiting Server Response...
    </div>

    <div id="results" style="display:none" class="results"></div>

  </div>

  <script>
    const EXAMPLE = 'A->B, A->C, B->D, C->E, E->F, X->Y, Y->Z, Z->X, P->Q, Q->R, G->H, G->H, G->I, hello, 1->2, A->';

    function loadExample() {
      document.getElementById('nodeInput').value = EXAMPLE;
    }

    function clearAll() {
      document.getElementById('nodeInput').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = 'Exception: ' + msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function renderTree(node, treeObj, prefix = '', isLast = true) {
      if (!treeObj || typeof treeObj !== 'object') return '';
      const children = Object.keys(treeObj[node] || {});
      let html = `<span class="tree-line">${prefix}<span class="tree-connector">${prefix ? (isLast ? '└─ ' : '├─ ') : ''}</span><span class="tree-node">${node}</span></span>`;
      children.forEach((child, i) => {
        const last = i === children.length - 1;
        const newPrefix = prefix + (isLast ? '   ' : '│  ');
        html += renderTree(child, treeObj[node], newPrefix, last);
      });
      return html;
    }

    function renderResults(data) {
      const { user_id, email_id, college_roll_number, hierarchies, invalid_entries, duplicate_edges, summary } = data;

      let html = `
    <div class="results-header">
      <div class="results-title">Output Ledger</div>
      <span class="badge">Status: 200 OK</span>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="val">${summary.total_trees}</div>
        <div class="lbl">Valid Topologies</div>
      </div>
      <div class="summary-card">
        <div class="val">${summary.total_cycles}</div>
        <div class="lbl">Cyclic Anomalies</div>
      </div>
      <div class="summary-card">
        <div class="val">${summary.largest_tree_root || '—'}</div>
        <div class="lbl">Apex Node</div>
      </div>
      <div class="summary-card">
        <div class="val">${hierarchies.length}</div>
        <div class="lbl">Total Structures</div>
      </div>
    </div>

    <div class="identity-row">
      <div class="identity-chip">Operator ID <span>${user_id}</span></div>
      <div class="identity-chip">Comm Link <span>${email_id}</span></div>
      <div class="identity-chip">Registry <span>${college_roll_number}</span></div>
    </div>

    <div class="content-section">
      <div class="section-label">III. Manifested Hierarchies</div>
      <div class="hierarchy-grid">
  `;

      for (const h of hierarchies) {
        if (h.has_cycle) {
          html += `
        <div class="h-card cyclic">
          <div class="h-header">
            <div class="root-label">${h.root}</div>
            <span class="badge badge-red">Fatal: Cycle</span>
          </div>
          <div class="cycle-msg">[!] Infinite loop detected.<br/>Graph recursion halted.</div>
        </div>
      `;
        } else {
          const treeHtml = renderTree(h.root, h.tree);
          html += `
        <div class="h-card">
          <div class="h-header">
            <div class="root-label">${h.root}</div>
            <span class="depth-badge">Depth [${h.depth}]</span>
          </div>
          <div class="tree-visual">${treeHtml}</div>
        </div>
      `;
        }
      }

      html += `</div></div>`;

      // Invalid entries & Duplicates (Merged into one section for minimal layout)
      html += `<div class="content-section"><div class="section-label">IV. Anomaly Report</div>`;

      html += `<div style="margin-top:24px;"><span style="font-size:11px; text-transform:uppercase; font-weight:700;">Syntax Violations (${invalid_entries.length})</span></div>`;
      if (invalid_entries.length === 0) {
        html += `<div class="empty-note">Zero syntax violations detected.</div>`;
      } else {
        html += `<div class="pill-row">`;
        for (const e of invalid_entries) {
          html += `<span class="pill pill-red">${e || '(NULL_OR_EMPTY)'}</span>`;
        }
        html += `</div>`;
      }

      html += `<div style="margin-top:32px;"><span style="font-size:11px; text-transform:uppercase; font-weight:700;">Redundant Edges (${duplicate_edges.length})</span></div>`;
      if (duplicate_edges.length === 0) {
        html += `<div class="empty-note">Zero redundancies detected.</div>`;
      } else {
        html += `<div class="pill-row">`;
        for (const e of duplicate_edges) {
          html += `<span class="pill">${e}</span>`;
        }
        html += `</div>`;
      }

      html += `</div>`; // End content-section

      document.getElementById('results').innerHTML = html;
      document.getElementById('results').style.display = 'block';
    }

    async function handleSubmit() {
      hideError();
      document.getElementById('results').style.display = 'none';

      const rawUrl = document.getElementById('apiUrl').value.trim();
      const rawInput = document.getElementById('nodeInput').value.trim();

      if (!rawUrl) { showError('Target destination (URL) is required.'); return; }
      if (!rawInput) { showError('Data matrix cannot be empty.'); return; }

      const data = rawInput
        .split(/[\n,]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      document.getElementById('loadingBox').style.display = 'flex';

      try {
        const apiUrl = rawUrl.replace(/\/$/, '') + '/bfhl';
        const resp = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data })
        });

        if (!resp.ok) {
          throw new Error(`Status Code ${resp.status}: ${resp.statusText}`);
        }

        const result = await resp.json();
        renderResults(result);
      } catch (err) {
        showError(err.message || 'Connection failure. Verify endpoint and network integrity.');
      } finally {
        btn.disabled = false;
        document.getElementById('loadingBox').style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('apiUrl').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSubmit();
      });
    });
  </script>
</body>

</html>
